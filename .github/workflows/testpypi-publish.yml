name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Version suffix (e.g. dev1, rc1)"
        required: false
        default: "dev1"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/notebooklm-py/
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Bump version for test
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "//;s/"//')
          NEW_VERSION="${VERSION}.${{ inputs.version_suffix }}"
          sed -i "s/version = \"${VERSION}\"/version = \"${NEW_VERSION}\"/" pyproject.toml
          echo "Publishing version: $NEW_VERSION"

      - name: Build package
        run: uv build

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/
