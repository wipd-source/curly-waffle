name: Verify Generated Artifacts

on:
  schedule:
    # Run weekly on Monday at 3am UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      notebook_id:
        description: "Notebook ID to use for artifact verification"
        required: false
        default: ""

jobs:
  verify-artifacts:
    name: Verify Generated Artifacts
    runs-on: ubuntu-latest
    environment: e2e-testing
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify artifact generation
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID: ${{ vars.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID }}
        run: |
          # Run the artifact generation verification tests
          uv run pytest tests/e2e/test_generation.py \
            -m e2e \
            --timeout=300 \
            -v \
            -k "not slow"

      - name: Run download verification
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID: ${{ vars.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID }}
        run: |
          uv run pytest tests/e2e/test_downloads.py \
            -m e2e \
            --timeout=300 \
            -v

      - name: Report status
        if: always()
        run: |
          echo "Artifact verification completed with status: ${{ job.status }}"
